name: Telegram Photo Bot

on:
  workflow_dispatch:

# Fixed run name so the dispatcher can detect an already-running bot
# by scanning run names — same stateless dedup as match workers.
run-name: telegram-bot

# Exactly one bot process may hold the token. Two of them long-polling the same
# bot split incoming updates randomly between them, so a conversation started
# on one instance loses its photo to the other — a failure that looks like the
# bot ignoring you. The dispatcher's run-name check normally prevents a second
# launch; this makes it an invariant rather than a race it has to win.
concurrency:
  group: telegram-photo-bot
  cancel-in-progress: false

permissions:
  actions: read   # watchdog lists match_bot.yml runs to know when to stop

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # if matches outlast this, the dispatcher relaunches within 15 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot under watchdog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # /card renders a whole card and posts it from here, so this job needs
          # the same publishing credentials a match worker has. Without them the
          # bot still runs and still takes photos — the manual flow is the only
          # thing that fails, and it says so in the chat.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/bot_watchdog.py
