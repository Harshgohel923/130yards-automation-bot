name: Match Worker

on: 
  workflow_dispatch:
    inputs:
      match_id:
        description: 'match_id from matches.json'
        required: true
        type: string
      label:
        description: 'Optional "Home vs Away" text, shown in the run name'
        required: false
        default: ''
        type: string

# Run name starts with match-{id} so the dispatcher can detect active workers
# by scanning run names — no external state needed. The team names after it are
# purely for humans reading the Actions list; anything parsing this name must
# stop at the first space.
run-name: match-${{ inputs.match_id }}${{ inputs.label && format(' · {0}', inputs.label) }}

# A worker that finishes a carousel match nudges the dispatcher to publish the
# group now rather than at its next 15-minute tick.
permissions:
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's hard ceiling for a hosted-runner job, and the
                           # wall clock starts at job start, not kickoff. That leaves
                           # MAX_MATCH_DURATION (290m, measured from kickoff) reachable
                           # for a normal fixture dispatched 30m early, and clipped to
                           # ~285m for a lineup fixture dispatched 75m early. FT
                           # detection ends the run long before either ceiling.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run match worker
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          # Group chat that receives pipeline alerts. Without this, alerts fall
          # back to the first id in TELEGRAM_ALLOWED_USER_IDS.
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          # Only used to nudge the dispatcher after a carousel handover.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 match_worker_runner.py ${{ inputs.match_id }}
